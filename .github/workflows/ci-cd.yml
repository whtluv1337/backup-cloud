name: Backup cloud CI-CD
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/init_secrets.py
      - run: docker compose config --quiet
      - run: docker compose up -d --build
      - run: python scripts/smoke.py
      - if: always()
        run: |
          mkdir -p evidence
          docker compose ps > evidence/compose-ps.txt
          docker compose logs --no-color > evidence/compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification
          path: evidence/
      - if: always()
        run: docker compose down --volumes
  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      prefix: ${{ steps.names.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4
      - id: names
        shell: bash
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push immutable commit tags
        env:
          IMAGE_PREFIX: ${{ steps.names.outputs.prefix }}
        run: |
          for service in proxy frontend api worker source; do
            docker build -f "docker/$service.Dockerfile" -t "$IMAGE_PREFIX/$service:$GITHUB_SHA" .
            docker push "$IMAGE_PREFIX/$service:$GITHUB_SHA"
          done
  deploy:
    # A temporary cloud demonstration, not a permanent public service.
    if: github.event_name != 'pull_request'
    needs: [test, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare isolated demonstration credentials
        run: |
          pip install requests
          python scripts/init_secrets.py
      - name: Login to private GHCR images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Initialize Swarm on the temporary cloud VM
        run: |
          docker swarm init --advertise-addr "$(hostname -I | awk '{print $1}')"
          manager_id=$(docker info --format '{{.Swarm.NodeID}}')
          docker node update --label-add backup.storage=true "$manager_id"
          docker secret create backup_api_token secrets/api_token.txt
          docker secret create backup_restic_password secrets/restic_password.txt
      - name: Deploy the images published by this commit
        env:
          IMAGE_PREFIX: ${{ needs.publish.outputs.prefix }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker stack deploy --with-registry-auth -c deploy/swarm.yaml backupcloud
          ready=no
          for attempt in $(seq 1 90); do
            states=$(docker stack services backupcloud --format '{{.Replicas}}')
            count=$(docker stack services backupcloud --format '{{.Name}}' | wc -l)
            if [ "$count" -eq 7 ] && ! printf '%s\n' "$states" | grep -qvE '^(1/1|2/2)$'; then
              ready=yes
              break
            fi
            sleep 2
          done
          test "$ready" = yes
      - name: Verify backup restore and repository integrity in the cloud
        run: |
          python scripts/smoke.py --url http://127.0.0.1:8080 --output evidence/cloud-swarm-smoke.json
      - name: Save deployment evidence
        if: always()
        run: |
          mkdir -p evidence
          docker node ls > evidence/cloud-nodes.txt 2>&1 || true
          docker stack services backupcloud > evidence/cloud-services.txt 2>&1 || true
          docker stack ps backupcloud --no-trunc > evidence/cloud-tasks.txt 2>&1 || true
          docker service logs backupcloud_worker > evidence/cloud-worker.log 2>&1 || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-deployment
          path: evidence/
          retention-days: 7
      - name: Remove the temporary cloud demonstration
        if: always()
        run: |
          docker stack rm backupcloud || true
          docker swarm leave --force || true
